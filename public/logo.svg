<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Document body - white paper -->
  <g transform="translate(28, 14)">
    <!-- Paper -->
    <path d="M8,0 L56,0 L64,8 L64,92 L8,92 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Fold corner -->
    <path d="M56,0 L56,8 L64,8 Z" fill="#64748b"/>
    
    <!-- "Edit" text - blue -->
    <text x="14" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#2563eb">Edit</text>
    
    <!-- "PDF" text - red -->
    <text x="14" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#dc2626">PDF</text>
    
    <!-- Text lines -->
    <rect x="14" y="64" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="14" y="72" width="28" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="14" y="80" width="32" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>
  
  <!-- Edit pencil icon -->
  <g transform="translate(74, 70) rotate(-45)">
    <rect x="0" y="0" width="7" height="28" rx="1" fill="#f59e0b"/>
    <polygon points="0,28 3.5,35 7,28" fill="#f59e0b"/>
    <rect x="1" y="0" width="5" height="5" rx="1" fill="#1e293b"/>
    <polygon points="1,28 3.5,33 6,28" fill="#1e293b"/>
  </g>
</svg>
