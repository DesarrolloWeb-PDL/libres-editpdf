<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Document body -->
  <g transform="translate(32, 18)">
    <!-- Paper with fold -->
    <path d="M8,0 L52,0 L60,8 L60,82 L8,82 Z" fill="url(#docGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Fold corner -->
    <path d="M52,0 L52,8 L60,8 Z" fill="#94a3b8"/>
    
    <!-- PDF text -->
    <text x="12" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="18" fill="#dc2626">PDF</text>
    
    <!-- Text lines -->
    <rect x="12" y="42" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="12" y="50" width="28" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="12" y="58" width="32" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="12" y="66" width="20" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>
  
  <!-- Edit pencil icon -->
  <g transform="translate(68, 68) rotate(-45)">
    <rect x="0" y="0" width="8" height="32" rx="1" fill="#f59e0b"/>
    <polygon points="0,32 4,40 8,32" fill="#f59e0b"/>
    <rect x="1" y="0" width="6" height="6" rx="1" fill="#1e293b"/>
    <polygon points="1,32 4,38 7,32" fill="#1e293b"/>
  </g>
</svg>
